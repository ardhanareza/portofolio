<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mine Ops Dashboard · Demo</title>
<meta name="description" content="Demo dashboard operasi tambang interaktif dengan data dummy: produksi, armada, performa tim, dan roster shift.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="../assets/vendor/phosphor/phosphor.css">
<link rel="stylesheet" href="../assets/site.css">
<link rel="icon" href="../assets/ikon.svg" type="image/svg+xml">
<style>
body{padding-left:112px}
/* ---------- rail (menu ikon kiri, seperti aplikasi aslinya) ---------- */
.rail{position:fixed;left:18px;top:18px;bottom:18px;width:76px;background:var(--rail);border-radius:38px;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:10px;z-index:50;box-shadow:0 18px 40px rgba(13,17,28,.28)}
.rail .logo{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#1B2236;color:#fff;text-decoration:none}
.rail nav{display:flex;flex-direction:column;gap:8px}
.rail .bawah{margin-top:auto;display:flex;flex-direction:column;gap:6px;align-items:center}
.rail button,.rail a.r{position:relative;width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:var(--rail-ink);display:grid;place-items:center;cursor:pointer;text-decoration:none;font:800 12px Nunito,sans-serif;transition:background-color .15s,color .15s}
.rail button .ph,.rail a.r .ph{font-size:22px}
.rail button:hover,.rail a.r:hover{color:#fff;background:rgba(255,255,255,.09)}
.rail button[aria-current="page"]{background:#DCE4FF;color:#13317F}
.rail .tip{position:absolute;left:58px;top:50%;transform:translateY(-50%);white-space:nowrap;background:#0D111C;color:#fff;border-radius:10px;padding:6px 10px;font:800 12.5px Nunito,sans-serif;opacity:0;pointer-events:none;transition:opacity .15s}
.rail button:hover .tip,.rail button:focus-visible .tip,.rail a.r:hover .tip,.rail a.r:focus-visible .tip{opacity:1}
.rail .bhs{display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.06);border-radius:16px;padding:3px}
.rail .bhs button{width:42px;height:30px;border-radius:12px}
.rail .bhs button[aria-pressed="true"]{background:#DCE4FF;color:#13317F}
/* ---------- kepala ---------- */
.wrap{max-width:1360px;margin:0 auto;padding:22px 24px 40px}
.kepala{display:flex;gap:12px 20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.kepala small{display:block;font:800 11.5px Nunito,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.kepala h1{font-size:30px;margin-top:2px}
.kepala p{margin:2px 0 0;color:var(--ink2);font-weight:700;font-size:14px}
.saring{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pita{display:flex;gap:10px;align-items:center;background:var(--acc-soft);color:var(--acc-ink);border-radius:16px;padding:10px 14px;font-weight:700;font-size:13.5px;margin-bottom:16px}
.pita .ph{font-size:20px;flex:none}
/* ---------- kartu & grid ---------- */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi .kartu{padding:14px 16px}
.kpi small{display:flex;gap:6px;align-items:center;color:var(--ink2);font:800 12px Nunito,sans-serif;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font:700 26px Lexend,sans-serif;margin-top:6px}
.kpi span{display:flex;gap:4px;align-items:center;font-size:13px;font-weight:700;color:var(--ink3);margin-top:2px}
.kpi .naik{color:var(--ok)}.kpi .turun{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.kartu h2{font-size:17px;display:flex;gap:8px;align-items:center}
.kartu h2 .ph{color:var(--acc)}
.kartu .sub{margin:2px 0 10px;color:var(--ink3);font-size:13px;font-weight:600}
.kartu-kepala{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--ink2)}
.lgd i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.lgd i.putus{background:repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 9px) !important}
.gf{position:relative;min-height:120px}
.gf-sumbu{font:600 11px Nunito,system-ui,sans-serif;fill:var(--muted);font-variant-numeric:tabular-nums}
.gf-label{font:800 11.5px Nunito,system-ui,sans-serif;fill:var(--ink2)}
.gf-tip{position:absolute;display:none;pointer-events:none;z-index:5;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px;font-size:12.5px}
.gf-tip b{display:block;margin-bottom:4px}
.gf-tip span{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--ink2)}
.gf-tip span i{width:10px;height:10px;border-radius:3px;flex:none}
.gf-tip em{font-style:normal;margin-left:auto;padding-left:12px;color:var(--ink);font-variant-numeric:tabular-nums}
details.tabel{margin-top:8px}
details.tabel summary{cursor:pointer;font-weight:800;font-size:13px;color:var(--acc);min-height:32px;display:inline-flex;align-items:center}
.gulir{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
table.t .n{text-align:right;font-variant-numeric:tabular-nums}
table.t tbody tr.pilih{cursor:pointer}
table.t tbody tr.pilih:hover{background:var(--panel2)}
table.t tbody tr[aria-selected="true"]{background:var(--acc-soft)}
/* status: warna + ikon + label (tidak pernah warna saja) */
.st{display:inline-flex;gap:6px;align-items:center;font-weight:800;font-size:12.5px;border-radius:999px;padding:2px 10px 2px 6px;background:var(--panel2)}
.st i{font-size:16px}
.st.OPERASI i{color:var(--st-good)}.st.STANDBY i{color:var(--st-warn)}.st.BREAKDOWN i{color:var(--st-crit)}.st.SERVIS i{color:var(--st-serious)}
.rasio{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:10px 0}
.rasio span{display:block;height:100%}
.rasio-ket{display:flex;gap:8px 18px;flex-wrap:wrap}
/* papan tim */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;margin:6px 0 16px}
.pod{text-align:center;border-radius:20px;padding:14px 8px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font:inherit;color:inherit}
.pod.p1{background:color-mix(in srgb,#F5B700 18%,var(--panel));border-color:#F5B700;padding-top:22px}
.pod .ava{width:52px;height:52px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:800 18px Lexend,sans-serif;color:#fff}
.pod b{display:block}.pod em{font-style:normal;font:700 22px Lexend,sans-serif;display:block}
.ava-kecil{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font:800 12px Lexend,sans-serif;margin-right:8px;vertical-align:middle}
.batang-h{display:block;height:8px;border-radius:4px;background:var(--panel2);min-width:80px;overflow:hidden}
.batang-h i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.dua-kolom{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.panel-detail{position:sticky;top:16px}
.kosong{color:var(--ink3);font-weight:700;text-align:center;padding:30px 10px}
/* roster */
.ro td,.ro th{text-align:center;padding:6px 4px;min-width:38px}
.ro th:first-child,.ro td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;min-width:110px}
.kd{display:inline-grid;place-items:center;width:34px;height:26px;border-radius:7px;font:800 11px Nunito,sans-serif}
.kd.D{background:#fff;color:#0F172A;box-shadow:inset 0 0 0 1px var(--line)}.kd.N{background:#3B82F6;color:#fff}.kd.OFF{background:#86EFAC;color:#14532D}
.kd.C{background:#F97316;color:#fff}.kd.IND{background:#FDE047;color:#713F12}
.ro th.hari-ini{color:var(--acc)}.ro td.hari-ini{background:var(--acc-soft)}
.tentang ul{margin:6px 0 0;padding-left:20px;line-height:1.8}
.cari{min-height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0 12px;font:700 14px Nunito,sans-serif;min-width:180px}
select.cari{padding-right:8px}
@media (max-width:1100px){.grid2,.dua-kolom{grid-template-columns:minmax(0,1fr)}.panel-detail{position:static}}
@media (max-width:760px){
  body{padding-left:0;padding-bottom:88px}
  .rail{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:68px;flex-direction:row;border-radius:24px;padding:8px 10px;overflow-x:auto;gap:4px}
  .rail .logo,.rail .tip{display:none}.rail nav{flex-direction:row}.rail .bawah{flex-direction:row;margin:0 0 0 auto}
  .rail .bhs{flex-direction:row}.rail .bhs button{width:34px;height:40px}
  .wrap{padding:16px 16px 24px}.kepala h1{font-size:24px}
  .kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi .kartu{padding:12px}.kpi b{font-size:20px}.kpi small{font-size:11px}
  .podium{gap:6px}.pod .ava{width:40px;height:40px;font-size:15px}.pod em{font-size:18px}
}
</style>
</head>
<body>
<a class="lewati" href="#isi" data-i18n="lewati">Lewati ke isi</a>
<aside class="rail" aria-label="Menu dashboard">
  <a class="logo" href="../" data-i18n-attr="aria-label:keportofolio"><img src="../assets/ikon.svg" alt="" width="40" height="40"></a>
  <nav id="tabs" aria-label="Halaman dashboard"></nav>
  <div class="bawah">
    <div class="bhs" role="group" data-i18n-attr="aria-label:bahasa"><button type="button" data-lang-btn="id">ID</button><button type="button" data-lang-btn="en">EN</button></div>
    <button type="button" data-tema-btn data-i18n-attr="aria-label:tema"><i class="ph ph-moon" aria-hidden="true"></i><span class="tip" data-i18n="tema"></span></button>
    <a class="r" href="../" data-i18n-attr="aria-label:keportofolio"><i class="ph ph-user-circle" aria-hidden="true"></i><span class="tip" data-i18n="keportofolio"></span></a>
  </div>
</aside>
<div class="wrap">
  <header class="kepala">
    <div><small data-i18n="eyebrow">Demo · Data dummy</small><h1 id="judul"></h1><p id="subjudul"></p></div>
    <div class="saring" id="saring"></div>
  </header>
  <div class="pita" role="note"><i class="ph ph-info" aria-hidden="true"></i><span data-i18n="pita">Semua angka, nama orang, pit, dan unit di demo ini adalah data karangan untuk portofolio.</span></div>
  <main id="isi" tabindex="-1"></main>
</div>
<script src="../assets/umum.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/grafik.js"></script>
<script src="../assets/demo.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
<!-- Tabel berantakan tersusun rapi, lalu garis relasi muncul: database dirancang ulang. -->
<style>
.t{transform-box:fill-box;transform-origin:center;animation:susun 9s cubic-bezier(.65,0,.35,1) infinite}
.t rect.k{stroke:#4A4D57;stroke-width:1.5;fill:#12141A}
.t rect.h{fill:#2A2D36}
.t line{stroke:#4A4D57;stroke-width:1.5}
.t rect.pk{fill:#F2A93B}
.r{stroke:#F2A93B;stroke-width:1.5;animation:garis 9s ease-in-out infinite}
.d{fill:#F2A93B;animation:titik 9s ease-in-out infinite}
@keyframes susun{0%,14%{transform:translate(var(--x),var(--y)) rotate(var(--r))}38%,84%{transform:none}100%{transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@keyframes garis{0%,40%{stroke-dashoffset:100;opacity:0}41%{opacity:1}54%,82%{stroke-dashoffset:0;opacity:1}90%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes titik{0%,52%{opacity:0}56%,82%{opacity:1}90%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="r-all">
  <path class="r" pathLength="100" stroke-dasharray="100" d="M92 52H124"/>
  <path class="r" pathLength="100" stroke-dasharray="100" d="M196 52H228"/>
  <path class="r" pathLength="100" stroke-dasharray="100" d="M56 82V118"/>
  <path class="r" pathLength="100" stroke-dasharray="100" d="M160 82V100H264V118"/>
  <path class="r" pathLength="100" stroke-dasharray="100" d="M92 140H124"/>
  <circle class="d" cx="92" cy="52" r="2.5"/><circle class="d" cx="228" cy="52" r="2.5"/><circle class="d" cx="56" cy="118" r="2.5"/><circle class="d" cx="264" cy="118" r="2.5"/><circle class="d" cx="124" cy="140" r="2.5"/>
</g>
<g class="t" style="--x:34px;--y:46px;--r:-14deg"><rect class="k" x="20" y="30" width="72" height="52"/><rect class="h" x="20.75" y="30.75" width="70.5" height="11"/><rect class="pk" x="26" y="48" width="5" height="5"/><line x1="35" y1="50.5" x2="80" y2="50.5"/><line x1="26" y1="61.5" x2="74" y2="61.5"/><line x1="26" y1="72.5" x2="66" y2="72.5"/></g>

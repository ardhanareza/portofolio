<g class="t" style="--x:44px;--y:-56px;--r:12deg;animation-delay:.15s"><rect class="k" x="20" y="118" width="72" height="52"/><rect class="h" x="20.75" y="118.75" width="70.5" height="11"/><rect class="pk" x="26" y="136" width="5" height="5"/><line x1="35" y1="138.5" x2="80" y2="138.5"/><line x1="26" y1="149.5" x2="74" y2="149.5"/><line x1="26" y1="160.5" x2="66" y2="160.5"/></g>

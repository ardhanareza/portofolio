<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
<!-- Data mengalir UMPC -> CPE -> database. CPE rusak, aliran berhenti, mekanik datang, CPE pulih, aliran jalan lagi. -->
<style>
.l{font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;fill:#6B6C73}
.alir{animation:alir 10s linear infinite}
.pk{fill:#F2A93B}
.a1{animation:a1 1.6s linear infinite}
.a2{animation:a2 1.6s linear infinite}
.a2b{animation-delay:-.8s}
.cpe{animation:cpe 10s linear infinite}
.sin{animation:sin 10s linear infinite}
.mek{animation:mek 10s ease-in-out infinite}
.ok{animation:ok 10s linear infinite}
@keyframes alir{0%,42%{opacity:1}44%,74%{opacity:0}76%,100%{opacity:1}}
@keyframes a1{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(0,-14px);opacity:1}}
@keyframes a2{0%{transform:translate(0,0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(192px,-18px);opacity:0}}
@keyframes cpe{0%,43%{fill:#3DD6A3}44%,73%{fill:#FF6B5A}74%,100%{fill:#3DD6A3}}
@keyframes sin{0%,43%{stroke:#3DD6A3;opacity:1}44%,73%{stroke:#FF6B5A;opacity:.25}74%,100%{stroke:#3DD6A3;opacity:1}}
@keyframes mek{0%,44%{transform:translate(90px,0);opacity:0}52%,70%{transform:translate(0,0);opacity:1}80%,100%{transform:translate(90px,0);opacity:0}}
@keyframes ok{0%,72%{opacity:0}74%,84%{opacity:1}88%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.mek,.ok{opacity:0}}
</style>
<!-- tanah -->
<path d="M0 172H320" stroke="#2A2D36" stroke-width="1.5"/>
<!-- dump truck tampak samping -->
<path d="M70 92H190L182 136H76Z" fill="#C98A2B"/>
<path d="M38 92H72V99H38Z" fill="#C98A2B"/>
<rect x="40" y="100" width="30" height="36" fill="#F2A93B"/>
<rect x="45" y="105" width="20" height="16" rx="1" fill="#0B0C10"/>
<rect x="30" y="136" width="160" height="9" fill="#F2A93B" opacity=".85"/>
<circle cx="62" cy="156" r="15" fill="#1C1F27" stroke="#4A4D57" stroke-width="2"/><circle cx="160" cy="156" r="15" fill="#1C1F27" stroke="#4A4D57" stroke-width="2"/>
<!-- UMPC di kabin -->
<rect x="49" y="108" width="12" height="9" rx="1" fill="#12141A" stroke="#F2A93B" stroke-width="1.2"/>
<text class="l" x="34" y="116" text-anchor="end">UMPC</text>
<!-- kabel UMPC -> CPE -->
<path d="M55 108V92" stroke="#0B0C10" stroke-width="1.5" stroke-dasharray="3 3"/>
<!-- CPE di atap kanopi -->
<rect class="cpe" x="48" y="82" width="14" height="10" rx="2"/>
<path d="M55 82V72" stroke="#9A9BA3" stroke-width="1.5"/>
<text class="l" x="42" y="90" text-anchor="end">CPE</text>
<!-- sinyal ke database -->
<path class="sin" d="M64 78Q70 72 64 66M70 82Q80 72 70 62" stroke-width="1.5" stroke-linecap="round"/>
<!-- database -->
<g transform="translate(262 34)"><ellipse cx="22" cy="6" rx="22" ry="6" fill="#12141A" stroke="#4A4D57" stroke-width="1.5"/><path d="M0 6V38Q22 48 44 38V6" fill="#12141A" stroke="#4A4D57" stroke-width="1.5"/><path d="M0 20Q22 30 44 20" stroke="#4A4D57" stroke-width="1.5"/></g>
<text class="l" x="284" y="98" text-anchor="middle">DB</text>
<!-- paket data -->
<g class="alir">
  <rect class="pk a1" x="53" y="104" width="4" height="4"/>
  <rect class="pk a2" x="66" y="70" width="5" height="5"/>
  <rect class="pk a2 a2b" x="66" y="70" width="5" height="5"/>
</g>
<!-- mekanik datang saat CPE rusak -->
<g class="mek"><circle cx="214" cy="140" r="7" fill="#1C1F27" stroke="#EDEBE6" stroke-width="1.5"/><path d="M204 172Q206 152 214 150Q222 152 224 172" fill="#1C1F27" stroke="#EDEBE6" stroke-width="1.5"/><path d="M226 150l8-8m-2-2 4 4" stroke="#F2A93B" stroke-width="2" stroke-linecap="round"/></g>
<!-- pulih -->
<path class="ok" d="M66 90l4 4 8-9" stroke="#3DD6A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

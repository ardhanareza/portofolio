<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" fill="none" role="img" aria-label="Data FMS mengalir dari UMPC ke CPE ke database, mekanik memulihkan CPE"><style>text{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
.s1{animation:st1 12s linear infinite}.s2{animation:st2 12s linear infinite}.s3{animation:st3 12s linear infinite}
.flow{stroke-dasharray:6 9;animation:alir .9s linear infinite,hidup 12s linear infinite}
.gate{animation:hidup 12s linear infinite}
.pulse{animation:denyut 1.4s ease-in-out infinite}.pulse2{animation:denyut 1.4s ease-in-out .35s infinite}
.led{animation:kedip .8s steps(1) infinite}.led2{animation:kedip .8s steps(1) .4s infinite}
.cpe{animation:cpe 12s linear infinite}
.xb{transform-box:fill-box;transform-origin:center;animation:silang 12s ease-out infinite}
.cb{transform-box:fill-box;transform-origin:center;animation:centang 12s ease-out infinite}
.tick{stroke-dasharray:1;animation:garis 12s ease-out infinite}
.rg{animation:servis 12s linear infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:putar 2.4s linear infinite}
.mech{animation:mekanik 12s linear infinite}
.flip{animation:balik 12s linear infinite}
.la{transform-origin:-2px -12px;animation:kaki-a 12s linear infinite}
.lb{transform-origin:2px -12px;animation:kaki-b 12s linear infinite}
.arm{transform-origin:-3px -24px;animation:lengan 12s linear infinite}
@keyframes st1{0%,39%{opacity:1}40%,84%{opacity:0}85%,100%{opacity:1}}
@keyframes st2{0%,39.5%{opacity:0}40.5%,69.5%{opacity:1}70.5%,100%{opacity:0}}
@keyframes st3{0%,69.5%{opacity:0}70.5%,84%{opacity:1}85%,100%{opacity:0}}
@keyframes alir{to{stroke-dashoffset:-15}}
@keyframes hidup{0%,39%{opacity:1}41%,71%{opacity:0}74%,100%{opacity:1}}
@keyframes denyut{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes kedip{0%{opacity:1}50%{opacity:.2}}
@keyframes cpe{0%,39.5%{stroke:#EDEBE6}40.5%,69.5%{stroke:#E5574B}70.5%,80%{stroke:#4FBF7F}84%,100%{stroke:#EDEBE6}}
@keyframes silang{0%,40%{opacity:0;transform:scale(.4)}42%{opacity:1;transform:scale(1.15)}44%,69%{opacity:1;transform:scale(1)}70.5%,100%{opacity:0;transform:scale(1)}}
@keyframes centang{0%,70%{opacity:0;transform:scale(.4)}72%{opacity:1;transform:scale(1.12)}74%,83%{opacity:1;transform:scale(1)}85%,100%{opacity:0;transform:scale(1)}}
@keyframes garis{0%,71%{stroke-dashoffset:1}75%,100%{stroke-dashoffset:0}}
@keyframes servis{0%,55.5%{opacity:0}57%,69%{opacity:1}70.5%,100%{opacity:0}}
@keyframes putar{to{transform:rotate(360deg)}}
@keyframes mekanik{0%,42%{transform:translate(350px,173.6px)}55%,69.5%{transform:translate(194px,173.6px)}84%,100%{transform:translate(350px,173.6px)}}
@keyframes balik{0%,69.4%{transform:scaleX(1)}69.5%,84.5%{transform:scaleX(-1)}85%,100%{transform:scaleX(1)}}
@keyframes kaki-a{0%,42%{transform:rotate(0deg)}44%{transform:rotate(18deg)}46%{transform:rotate(-18deg)}48%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}52%{transform:rotate(18deg)}54%{transform:rotate(-18deg)}55%,70%{transform:rotate(0deg)}72%{transform:rotate(-18deg)}74%{transform:rotate(18deg)}76%{transform:rotate(-18deg)}78%{transform:rotate(18deg)}80%{transform:rotate(-18deg)}82%{transform:rotate(18deg)}84%,100%{transform:rotate(0deg)}}
@keyframes kaki-b{0%,42%{transform:rotate(0deg)}44%{transform:rotate(-18deg)}46%{transform:rotate(18deg)}48%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}52%{transform:rotate(-18deg)}54%{transform:rotate(18deg)}55%,70%{transform:rotate(0deg)}72%{transform:rotate(18deg)}74%{transform:rotate(-18deg)}76%{transform:rotate(18deg)}78%{transform:rotate(-18deg)}80%{transform:rotate(18deg)}82%{transform:rotate(-18deg)}84%,100%{transform:rotate(0deg)}}
@keyframes lengan{0%,56%{transform:rotate(0deg)}58.5%{transform:rotate(22deg)}61%{transform:rotate(-22deg)}63.5%{transform:rotate(22deg)}66%{transform:rotate(-22deg)}68.5%{transform:rotate(22deg)}69%,100%{transform:rotate(0deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.s2,.s3,.xb,.cb,.rg{opacity:0}}

.pl{animation:jatuh 10.5s ease-in infinite}
.pd{animation:tumpah 10.5s ease-in infinite}
.hl{transform-box:fill-box;transform-origin:center;animation:sorot 10.5s ease-out infinite}
.op{animation:operator 10.5s linear infinite}
.csr{animation:csbox 10.5s linear infinite}
.cst{animation:cstext 10.5s linear infinite}
@keyframes jalan{
0%,12%{transform:translate(58px,92px);opacity:1;animation-timing-function:ease-in-out}
36%,45%{transform:translate(250px,92px);opacity:1;animation-timing-function:ease-in}

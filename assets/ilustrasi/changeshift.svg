91.5%,100%{transform:translate(58px,92px);opacity:1}}
@keyframes arah{0%,49.4%{transform:scaleX(1)}49.5%,88.4%{transform:scaleX(-1)}88.5%,100%{transform:scaleX(1)}}
@keyframes tuang{0%,37%{transform:rotate(0deg)}39.5%,42%{transform:rotate(-26deg)}44.5%,100%{transform:rotate(0deg)}}
@keyframes muatan{0%,1.5%{transform:scaleY(0);opacity:0}3%{opacity:1}11%,38%{transform:scaleY(1);opacity:1}41%,100%{transform:scaleY(.2);opacity:0}}
@keyframes jatuh{0%,1.5%{transform:translateY(-4px);opacity:0}3%{opacity:1}6%{transform:translateY(14px);opacity:0}6.1%{transform:translateY(-4px);opacity:0}7.5%{opacity:1}10.5%,100%{transform:translateY(14px);opacity:0}}
@keyframes tumpah{0%,38.5%{transform:translate(0,0);opacity:0}39.5%{opacity:1}43%,100%{transform:translate(-4px,14px);opacity:0}}
@keyframes sorot{0%,65.5%{opacity:0;transform:scale(.6)}67%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}72.5%,100%{opacity:0;transform:scale(1)}}
@keyframes operator{0%,66%{fill:#9A9BA3}67%,72%{fill:#F2A93B}73%,100%{fill:#9A9BA3}}
@keyframes csbox{0%,6%{stroke:#F2A93B;stroke-opacity:1}7%,31.5%{stroke:#EDEBE6;stroke-opacity:.45}32.5%,39.5%{stroke:#F2A93B;stroke-opacity:1}40.5%,64.5%{stroke:#EDEBE6;stroke-opacity:.45}65.5%,72.5%{stroke:#F2A93B;stroke-opacity:1}73.5%,97.5%{stroke:#EDEBE6;stroke-opacity:.45}98.5%,100%{stroke:#F2A93B;stroke-opacity:1}}
@keyframes cstext{0%,6%{fill:#F2A93B}7%,31.5%{fill:#9A9BA3}32.5%,39.5%{fill:#F2A93B}40.5%,64.5%{fill:#9A9BA3}65.5%,72.5%{fill:#F2A93B}73.5%,97.5%{fill:#9A9BA3}98.5%,100%{fill:#F2A93B}}

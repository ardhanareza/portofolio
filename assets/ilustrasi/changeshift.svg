<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" fill="none" role="img" aria-label="Tiga dump truck bergiliran change shift di titik CS"><style>text{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
.k{animation:jalan 10.5s linear infinite}
.fl{animation:arah 10.5s linear infinite}
.bed{transform-origin:-21px -14px;animation:tuang 10.5s ease-in-out infinite}
